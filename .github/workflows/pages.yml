name: Pages

# Publica a landing page (site/) no GitHub Pages. Só deploy: não roda nem
# altera nenhum gate do CI. A marca vive em marca/ e entra no site só aqui,
# na montagem, para não existir uma segunda cópia dos SVGs no repositório.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "marca/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar a landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site com a marca
        run: |
          mkdir -p _site/marca
          cp -R site/. _site/
          cp marca/*.svg _site/marca/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
