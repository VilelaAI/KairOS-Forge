name: Pages

# Publica a landing page (site/) no GitHub Pages. Só deploy: não roda nem
# altera nenhum gate do CI. A marca vive em marca/ e entra no site só aqui,
# na montagem, para não existir uma segunda cópia dos SVGs no repositório.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "marca/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar a landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Montar o site com a marca
        run: |
          mkdir -p _site/marca
          cp -R site/. _site/
          cp marca/*.svg _site/marca/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
