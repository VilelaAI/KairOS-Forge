name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispara o eval de roteamento da Laura NA BRANCH, antes do merge: mudança de
  # description precisa ser medida antes de chegar à base, não depois (ADR-0038).
  workflow_dispatch:

jobs:
  verificar:
    name: Consistência da fábrica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync multi-CLI sem diff pendente
        run: |
          python3 scripts/sync-multi-cli.py
          python3 plugin/scripts/sync-multi-cli.py
          git diff --exit-code || {
            echo "::error::.agents/ ou .cursor/ desatualizados — rode scripts/sync-multi-cli.py (raiz e plugin/) e commite"
            exit 1
          }

      - name: Versão, contagens, paridade, mirrors e integridade dos gold sets
        # Inclui a boa-formação de evals/comportamento-fabrica/gold.jsonl (ADR-0031):
        # o eval precisa de modelo para rodar, mas a integridade do conjunto não —
        # e é ela que apodrece em silêncio.
        run: python3 scripts/release.py check

      - name: Suíte do próprio plugin (ADR-0039)
        # 103+ testes só-stdlib: scripts como CLI em repositório temporário, hooks
        # EXECUTADOS com payload sintético, falha injetada na publicação de estado,
        # saneamento da trajetória, invariantes do pacote e somente-leitura.
        # `tests/__init__.py` existe para o discover achar os módulos — sem ele o
        # discover roda zero testes e parece verde.
        run: python3 -m unittest discover -s tests -t . -v

      - name: Segurança dos agentes (allow-lists, hooks e segredos)
        # O argumento é a RAIZ DA ÁRVORE, não a pasta de agentes. Passar `agents`
        # fazia o script procurar `agents/agents/` e reportar verde sobre 0 agentes
        # e 0 hooks — instrumento que mede nada e diz que está tudo bem.
        run: |
          python3 scripts/check-agent-security.py .
          python3 plugin/scripts/check-agent-security.py plugin

      - name: Grafo de conhecimento válido (se existir)
        run: |
          if [ -d .agents/grafo ] && ls .agents/grafo/*.jsonl >/dev/null 2>&1; then
            python3 scripts/grafo.py validar
          else
            echo "sem grafo no repo do plugin — ok"
          fi

      - name: Guardrails determinísticos (ADR-0022)
        run: |
          python3 scripts/guardrail.py verificar .
          python3 plugin/scripts/guardrail.py verificar plugin

  eval-roteamento:
    name: Eval de roteamento da Laura
    runs-on: ubuntu-latest
    # Caro em tokens: não roda em todo PR. Manual, ou no merge para main.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Rodar o gold set (limiar 90%)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Sem chave, o runner pula com exit 0 — falso vermelho treina o time a
        # ignorar o vermelho (ADR-0025).
        run: python3 evals/roteamento-laura/rodar.py --limiar 90
