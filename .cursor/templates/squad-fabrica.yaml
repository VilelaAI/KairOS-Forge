squad:
  id: fabrica-forge
  tipo: desenvolvimento
  idioma: pt-BR
  versao: "0.15.0"
  descricao: "Fábrica de software completa com 40 agentes especializados, organizada em 11 times. Versão MIT/genérica do squad. Para domínios regulados (LGPD, Segurança-TI, NRs, OAB), use kairos-ai."

  times:
    - nome: "Liderança"
      agentes: [laura-tech-lead, rafael-staff]
    - nome: "Produto"
      agentes: [camila-pm, isabela-ux]
    - nome: "Arquitetura"
      agentes: [diego-sistemas, fernanda-dados, thiago-integracoes, ivan-modernizacao, murilo-eventos]
    - nome: "Frontend"
      agentes: [marina-frontend, pablo-ui, ada-acessibilidade]
    - nome: "Backend"
      agentes: [lucas-backend, gabriel-ia, juliana-etl]
    - nome: "Dados"
      agentes: [carlos-dba, andre-busca, olivia-grafos, bento-analytics]
    - nome: "Ciência de Dados"
      agentes: [davi-ciencia-dados, milena-ml, heitor-mlops]
    - nome: "Mobile"
      agentes: [yasmin-mobile, theo-distribuicao]
    - nome: "Qualidade"
      agentes: [patricia-qa, ricardo-testes, vinicius-performance, alice-evals]
    - nome: "Plataforma"
      agentes: [marcos-devops, elisa-cloud, helena-security, renata-observabilidade, igor-iac, kaique-kubernetes, gael-gitops, nina-redes, sergio-sre, aline-aiops]
    - nome: "Documentação"
      agentes: [beatriz-docs, felipe-api-docs]

  acionamento:
    regra: "Laura (Tech Lead) analisa complexidade e aciona apenas agentes relevantes."
    niveis:
      bug_simples:
        agentes: ["1 dev relevante", "ricardo-testes"]
        descricao: "Bug em arquivo único, fix < 50 linhas"
      feature_pequena:
        agentes: ["laura-tech-lead", "2-3 devs", "ricardo-testes"]
        descricao: "Feature em 1-2 telas, sem mudança de schema"
      feature_media:
        agentes: ["laura-tech-lead", "diego-sistemas", "4-5 devs", "patricia-qa", "ricardo-testes"]
        descricao: "Feature com schema novo, 3+ telas, integração externa"
      feature_grande:
        agentes: ["laura-tech-lead", "rafael-staff", "time completo"]
        descricao: "Módulo novo, refactor estrutural, mudança arquitetural"
      decisao_arquitetural:
        agentes: ["rafael-staff", "diego-sistemas", "fernanda-dados"]
        descricao: "ADR — escolha de tecnologia, padrão, framework"
      auditoria_seguranca:
        agentes: ["helena-security"]
        descricao: "Pre-PR ou após mudança em auth, input, banco"
      otimizacao_performance:
        agentes: ["vinicius-performance", "carlos-dba"]
        descricao: "Lentidão investigada com profiling"
      acessibilidade:
        agentes: ["ada-acessibilidade"]
        descricao: "Auditoria WCAG ou correção de ARIA"
      deploy_infra:
        agentes: ["marcos-devops", "elisa-cloud"]
        descricao: "CI/CD novo, escolha de provedor, rollback"
      infra_como_codigo:
        agentes: ["igor-iac", "elisa-cloud"]
        descricao: "Provisionar/alterar infra via Terraform, módulos, state remoto, drift"
      orquestracao_containers:
        agentes: ["kaique-kubernetes", "marcos-devops"]
        descricao: "Deploy em Kubernetes/EKS, Helm, autoscaling (HPA/Karpenter), Ingress"
      entrega_continua:
        agentes: ["gael-gitops", "marcos-devops"]
        descricao: "GitOps, ArgoCD, Kustomize, deploy declarativo, progressive delivery"
      rede_e_borda:
        agentes: ["nina-redes", "elisa-cloud"]
        descricao: "VPC, subnets, DNS, Load Balancer, CDN, WAF, TLS, security groups"
      resposta_a_incidente:
        agentes: ["sergio-sre", "marcos-devops"]
        descricao: "Incidente em produção: triagem por severidade, runbook, mitigação, postmortem, error budget"
      aiops_deteccao:
        agentes: ["aline-aiops", "renata-observabilidade"]
        descricao: "Detecção de anomalia, correlação/redução de ruído de alertas, RCA assistida, observabilidade aumentada"
      desenvolvimento_mobile:
        agentes: ["yasmin-mobile", "theo-distribuicao"]
        descricao: "App mobile: telas, offline-first, push, deep links — e o ciclo de release nas lojas (assinatura, review, rollout gradual)"
      modernizacao_legado:
        agentes: ["ivan-modernizacao", "diego-sistemas"]
        descricao: "Strangler fig, migração de framework/versão, decomposição incremental com rollback por etapa (consome o /mapear-arquitetura)"
      evals_de_ia:
        agentes: ["alice-evals", "gabriel-ia"]
        descricao: "Avaliação independente de sistemas de IA: eval harness, gold sets, red team de prompts, regressão de prompt como gate"
      analytics:
        agentes: ["bento-analytics", "juliana-etl"]
        descricao: "Modelagem dimensional, marts, camada semântica, métricas com definição única e testada"
      eventos_streaming:
        agentes: ["murilo-eventos", "lucas-backend"]
        descricao: "Mensageria, event-driven, outbox, idempotência, replay, contratos de evento, DLQs"
      ciencia_de_dados:
        agentes: ["davi-ciencia-dados", "milena-ml"]
        descricao: "Análise exploratória, estatística, hipóteses, experimentos e modelos de ML clássico sobre dados do produto"
      mlops:
        agentes: ["heitor-mlops", "marcos-devops"]
        descricao: "Deploy de modelo, monitoramento de drift, retraining, model registry e rollback de modelo"
      grafo_de_conhecimento:
        agentes: ["olivia-grafos", "andre-busca"]
        descricao: "Construir/atualizar/consultar o grafo de conhecimento (.agents/grafo/), pergunta multi-hop, memória compartilhada entre agentes, fundamentação de validação"
      documentacao:
        agentes: ["beatriz-docs"]
        descricao: "README, ADR, runbook, onboarding"
      api_docs:
        agentes: ["felipe-api-docs"]
        descricao: "OpenAPI, exemplos, error codes"

  comportamento:
    primeira_pessoa: true
    apresentacao_obrigatoria: "Oi, [Nome] aqui — [Papel]."
    referencia_a_colegas: "Sempre pelo nome (ex: 'pede pro Carlos', 'Helena audita isso')"
    idioma: "PT-BR em todas as comunicações"
    artefatos: "Cada turno entrega algo concreto: spec, código, análise, checklist"
    checkpoint: "Indicar quando precisa de aprovação humana"

  diferenca_kairos_ai_pro: |
    Esta fábrica genérica NÃO inclui:
    - Squads negociais (DPO, Mapeamento, Consentimento, etc.)
    - Domínios regulados (LGPD, Segurança-TI, NRs, OAB, MEC)
    - Guardrails com referência legal
    - Assertions binárias por domínio
    - Ralph Loop (auto-correção até 3 tentativas)
    - Advisor (Opus para decisões regulatórias)
    - Modo `--workflow debate` (planejado pra v0.5)

    Para qualquer projeto onde compliance regulatório é primeiro classe,
    use o kairos-ai (https://github.com/VilelaAI/kairos-ai) em vez deste.

  squads_apoio:
    descricao: "10 squads de apoio com 31 agentes. Tipo: apoio. NUNCA implementam código — produzem artefatos textuais. Acionados via /kairos-forge:rodar apoio-<nome>."
    regra: "Squads de apoio complementam (não substituem) a fábrica core. Máximo 1 squad de apoio ativo por vez na sessão."

    squads:
      apoio-microcopy:
        agentes: [apoio-celina-microcopy, apoio-renato-docs, apoio-leticia-revisao, apoio-ingrid-localizacao]
        complementa: [beatriz-docs, pablo-ui]
        sinais_ativacao: [microcopy, i18n, l10n, tradução, "multi-idioma", "texto de erro", "mensagem de erro", "empty state", tooltip, placeholder, label, "texto de interface", "UX writing", "documentação de usuário", onboarding, "revisão textual"]
        descricao: "Textos de UI, mensagens de erro, empty states, tooltips, revisão textual"

      apoio-narrativa:
        agentes: [apoio-marcos-specs, apoio-helena-apresentacao, apoio-dante-desbloqueio]
        complementa: [rafael-staff, camila-pm]
        sinais_ativacao: [narrativa, storytelling, apresentação, demo, ADR, "decisão arquitetural", "spec travada", desbloqueio, "estruturar argumento"]
        descricao: "Specs estruturadas, ADRs, demos para stakeholders, desbloqueio de decisões"

      apoio-naming:
        agentes: [apoio-elisa-naming, apoio-bruno-taxonomia, apoio-cora-voz]
        complementa: [pablo-ui, beatriz-docs]
        sinais_ativacao: [naming, "nome de feature", "nome de componente", taxonomia, "design tokens", "voz do produto", "tom de voz", "como chamar", nomenclatura, "glossário de produto"]
        descricao: "Nomenclatura, taxonomia, design tokens, voz do produto"

      apoio-valor:
        agentes: [apoio-hugo-priorizacao, apoio-sofia-lancamento, apoio-rui-audit]
        complementa: [camila-pm, laura-tech-lead]
        sinais_ativacao: [priorização, valor, ROI, "custo-benefício", "tech debt", "dívida técnica", lançamento, "release notes", "ICE score", impacto, "o que fazer primeiro"]
        descricao: "Priorização, releases, audit de custo-benefício e ROI"

      apoio-observabilidade:
        agentes: [apoio-lia-instrumentacao, apoio-otavio-metricas, apoio-vera-growth]
        complementa: [renata-observabilidade, vinicius-performance]
        sinais_ativacao: [tracking, analytics, métricas, eventos, "feature flag", AARRR, funil, conversão, growth, retenção, instrumentação, "o que medir"]
        descricao: "Tracking plans, métricas AARRR, feature flags, experimentação"

      apoio-dx:
        agentes: [apoio-enzo-dx, apoio-clara-comunidade, apoio-tomas-impacto]
        complementa: [beatriz-docs, marcos-devops]
        sinais_ativacao: ["developer experience", DX, contribuidor, "onboarding de dev", "DORA metrics", "lead time", contributor, "documentação de dev", "setup do projeto", "primeiro PR"]
        descricao: "Developer experience, contributor ladder, métricas DORA"

      apoio-revisao-arquitetural:
        agentes: [apoio-alvaro-inversao, apoio-lucia-principios, apoio-felix-provocador]
        complementa: [rafael-staff, diego-sistemas]
        sinais_ativacao: ["revisão arquitetural", "review de arquitetura", "pre-mortem", "red team", steelman, strawman, "advogado do diabo", inversão, "questionar decisão", "validar arquitetura", trade-off]
        descricao: "Inversão de Munger, pre-mortem, red team, debate estruturado"

      apoio-requisitos:
        agentes: [apoio-joana-elicitacao, apoio-caio-aceite, apoio-norma-nfr]
        complementa: [camila-pm, laura-tech-lead]
        sinais_ativacao: [requisitos, elicitação, "levantamento de requisitos", "user story", "história de usuário", "critério de aceite", ambiguidade, "requisito não-funcional", NFR, stakeholder, "o que o cliente quer", "escopo confuso"]
        descricao: "Engenharia de requisitos: elicitação da necessidade real (Joana), critérios de aceite verificáveis (Caio), NFRs e consistência (Norma)"

      apoio-gestao:
        agentes: [apoio-iara-planejamento, apoio-breno-riscos, apoio-talita-entregas]
        complementa: [laura-tech-lead, camila-pm]
        sinais_ativacao: ["gestão de projeto", cronograma, prazo, marco, milestone, estimativa, "caminho crítico", risco, RAID, "dependência externa", "status report", entrega, atraso, "plano de projeto", follow-up]
        descricao: "Gestão de projetos e entregas: planejamento por marcos (Iara), riscos/RAID (Breno) e status honesto baseado em evidência (Talita)"

      apoio-governanca:
        agentes: [apoio-vitor-catalogo, apoio-regina-qualidade, apoio-paula-politicas]
        complementa: [fernanda-dados, helena-security, juliana-etl]
        sinais_ativacao: ["catálogo de dados", linhagem, "dicionário de dados", "qualidade de dados", "contrato de dados", freshness, "política de acesso", ownership, "menor privilégio", "quem pode ver", "de onde vem esse dado"]
        descricao: "Governança técnica de dados: catálogo e linhagem (Vitor), qualidade com número (Regina), políticas de acesso e ownership (Paula). Regulatório (LGPD/DPO) é kairos-ai"

    colisoes_de_nome:
      regra: "Quando o usuário disser apenas o primeiro nome de um agente que existe nos dois lados, Laura desambigua antes de invocar."
      pares:
        - core: marcos-devops
          apoio: apoio-marcos-specs
          contexto_core: "devops, CI/CD, deploy"
          contexto_apoio: "ADR, spec, decisão narrada"
        - core: helena-security
          apoio: apoio-helena-apresentacao
          contexto_core: "audit, OWASP, segurança"
          contexto_apoio: "demo, storytelling, apresentação"
        - core: elisa-cloud
          apoio: apoio-elisa-naming
          contexto_core: "cloud, FinOps, escolha de provedor"
          contexto_apoio: "naming, nomenclatura"
