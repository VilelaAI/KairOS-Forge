name: CI

on:
  push:
    branches: [main]
  pull_request:
  # O job eval-roteamento já previa o disparo manual no `if`, mas sem este
  # gatilho o ramo nunca acontecia.
  workflow_dispatch:

jobs:
  verificar:
    name: Consistência da fábrica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync multi-CLI sem diff pendente
        run: |
          python3 scripts/sync-multi-cli.py
          python3 plugin/scripts/sync-multi-cli.py
          git diff --exit-code || {
            echo "::error::.agents/ ou .cursor/ desatualizados — rode scripts/sync-multi-cli.py (raiz e plugin/) e commite"
            exit 1
          }

      - name: Versão, contagens, paridade, mirrors e integridade dos gold sets
        # Inclui a boa-formação de evals/comportamento-fabrica/gold.jsonl (ADR-0031):
        # o eval precisa de modelo para rodar, mas a integridade do conjunto não —
        # e é ela que apodrece em silêncio. E o `prova.py selado` (ADR-0043): caso
        # de evals/*/selado.jsonl copiado para persona, skill ou doc reprova.
        run: python3 scripts/release.py check

      - name: Segurança dos agentes (allow-lists, hooks e segredos)
        # O argumento é a RAIZ DA ÁRVORE, não a pasta de agentes. Passar `agents`
        # fazia o script procurar `agents/agents/` e reportar verde sobre 0 agentes
        # e 0 hooks — instrumento que mede nada e diz que está tudo bem.
        run: |
          python3 scripts/check-agent-security.py .
          python3 plugin/scripts/check-agent-security.py plugin

      - name: Grafo de conhecimento válido (se existir)
        run: |
          if [ -d .agents/grafo ] && ls .agents/grafo/*.jsonl >/dev/null 2>&1; then
            python3 scripts/grafo.py validar
          else
            echo "sem grafo no repo do plugin — ok"
          fi

      - name: Guardrails determinísticos (ADR-0022)
        run: |
          python3 scripts/guardrail.py verificar .
          python3 plugin/scripts/guardrail.py verificar plugin

      - name: Testes dos scripts (stdlib unittest)
        # Contratos que um runner externo depende (ADR-0034): idempotência do
        # `registrar`, digest da SPEC, `reaprovar` só depois da aprovação.
        run: python3 -m unittest discover -s scripts/tests -t scripts -v

      - name: Eval de ponta a ponta sem modelo (ADR-0049)
        # Cada oráculo reprova o projeto como está e as soluções erradas conhecidas, e
        # aprova a solução de referência. Sem isso, a rodada paga mede um oráculo frouxo.
        run: |
          python3 evals/tarefas-fabrica/rodar.py validar
          python3 -m unittest discover -s evals/tarefas-fabrica -p 'test_*.py' -v

  mod-painel:
    name: Mod do painel do arco
    # O mod (hooks/painel.tsx, ADR-0051) só roda no Claude Code, então é o próprio
    # Claude Code que o valida e roda os testes dele (tests/*.test.tsx): sem chave de
    # API e sem modelo. Versão pinada: a API de mods ainda muda entre versões, e o
    # vermelho por uma versão nova tem de ser uma decisão, não uma surpresa.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.318

      - name: Validar o plugin e rodar os testes do mod
        run: |
          claude plugin validate .
          claude plugin validate plugin
          claude plugin test .

  eval-roteamento:
    name: Eval de roteamento da Laura
    runs-on: ubuntu-latest
    # Caro em tokens: não roda em todo PR. Manual, ou no merge para main.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Rodar o gold set (limiar 90%)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Sem chave, o runner pula com exit 0 — falso vermelho treina o time a
        # ignorar o vermelho (ADR-0025).
        run: python3 evals/roteamento-laura/rodar.py --limiar 90
