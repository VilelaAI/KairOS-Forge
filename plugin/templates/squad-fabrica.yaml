squad:
  id: fabrica-forge
  tipo: desenvolvimento
  idioma: pt-BR
  versao: "0.8.0"
  descricao: "Fábrica de software completa com 86 agentes: 24 core (9 times), 41 em 9 squads verticais (executores sob demanda por tipo de projeto, incluindo segurança) e 21 em 7 squads de apoio (artefatos textuais). Versão MIT/genérica do squad. Para domínios regulados (LGPD, Segurança-TI, NRs, OAB), use kairos-ai."

  times:
    - nome: "Liderança"
      agentes: [laura-tech-lead, rafael-staff]
    - nome: "Produto"
      agentes: [camila-pm, isabela-ux]
    - nome: "Arquitetura"
      agentes: [diego-sistemas, fernanda-dados, thiago-integracoes]
    - nome: "Frontend"
      agentes: [marina-frontend, pablo-ui, ada-acessibilidade]
    - nome: "Backend"
      agentes: [lucas-backend, gabriel-ia, juliana-etl]
    - nome: "Dados"
      agentes: [carlos-dba, andre-busca]
    - nome: "Qualidade"
      agentes: [patricia-qa, ricardo-testes, vinicius-performance]
    - nome: "Plataforma"
      agentes: [marcos-devops, elisa-cloud, helena-security, renata-observabilidade]
    - nome: "Documentação"
      agentes: [beatriz-docs, felipe-api-docs]

  acionamento:
    regra: "Laura (Tech Lead) analisa complexidade e aciona apenas agentes relevantes."
    niveis:
      bug_simples:
        agentes: ["1 dev relevante", "ricardo-testes"]
        descricao: "Bug em arquivo único, fix < 50 linhas"
      feature_pequena:
        agentes: ["laura-tech-lead", "2-3 devs", "ricardo-testes"]
        descricao: "Feature em 1-2 telas, sem mudança de schema"
      feature_media:
        agentes: ["laura-tech-lead", "diego-sistemas", "4-5 devs", "patricia-qa", "ricardo-testes"]
        descricao: "Feature com schema novo, 3+ telas, integração externa"
      feature_grande:
        agentes: ["laura-tech-lead", "rafael-staff", "time completo"]
        descricao: "Módulo novo, refactor estrutural, mudança arquitetural"
      decisao_arquitetural:
        agentes: ["rafael-staff", "diego-sistemas", "fernanda-dados"]
        descricao: "ADR — escolha de tecnologia, padrão, framework"
      auditoria_seguranca:
        agentes: ["helena-security"]
        descricao: "Pre-PR ou após mudança em auth, input, banco"
      otimizacao_performance:
        agentes: ["vinicius-performance", "carlos-dba"]
        descricao: "Lentidão investigada com profiling"
      acessibilidade:
        agentes: ["ada-acessibilidade"]
        descricao: "Auditoria WCAG ou correção de ARIA"
      deploy_infra:
        agentes: ["marcos-devops", "elisa-cloud"]
        descricao: "CI/CD novo, escolha de provedor, rollback"
      documentacao:
        agentes: ["beatriz-docs"]
        descricao: "README, ADR, runbook, onboarding"
      api_docs:
        agentes: ["felipe-api-docs"]
        descricao: "OpenAPI, exemplos, error codes"

  comportamento:
    primeira_pessoa: true
    apresentacao_obrigatoria: "Oi, [Nome] aqui — [Papel]."
    referencia_a_colegas: "Sempre pelo nome (ex: 'pede pro Carlos', 'Helena audita isso')"
    idioma: "PT-BR em todas as comunicações"
    artefatos: "Cada turno entrega algo concreto: spec, código, análise, checklist"
    checkpoint: "Indicar quando precisa de aprovação humana"

  diferenca_kairos_ai_pro: |
    Esta fábrica genérica NÃO inclui:
    - Squads negociais (DPO, Mapeamento, Consentimento, etc.)
    - Domínios regulados (LGPD, Segurança-TI, NRs, OAB, MEC)
    - Guardrails com referência legal
    - Assertions binárias por domínio
    - Ralph Loop (auto-correção até 3 tentativas)
    - Advisor (Opus para decisões regulatórias)
    - Modo `--workflow debate` (planejado pra v0.5)

    Para qualquer projeto onde compliance regulatório é primeiro classe,
    use o kairos-ai (https://github.com/VilelaAI/kairos-ai) em vez deste.

  squads_apoio:
    descricao: "7 squads de apoio com 21 agentes. Tipo: apoio. NUNCA implementam código — produzem artefatos textuais. Acionados via /kairos-forge:rodar apoio-<nome>."
    regra: "Squads de apoio complementam (não substituem) a fábrica core. Máximo 1 squad de apoio ativo por vez na sessão."

    squads:
      apoio-microcopy:
        agentes: [apoio-celina-microcopy, apoio-renato-docs, apoio-leticia-revisao]
        complementa: [beatriz-docs, pablo-ui]
        sinais_ativacao: [microcopy, "texto de erro", "mensagem de erro", "empty state", tooltip, placeholder, label, "texto de interface", "UX writing", "documentação de usuário", onboarding, "revisão textual"]
        descricao: "Textos de UI, mensagens de erro, empty states, tooltips, revisão textual"

      apoio-narrativa:
        agentes: [apoio-marcos-specs, apoio-helena-apresentacao, apoio-dante-desbloqueio]
        complementa: [rafael-staff, camila-pm]
        sinais_ativacao: [narrativa, storytelling, apresentação, demo, ADR, "decisão arquitetural", "spec travada", desbloqueio, "estruturar argumento"]
        descricao: "Specs estruturadas, ADRs, demos para stakeholders, desbloqueio de decisões"

      apoio-naming:
        agentes: [apoio-elisa-naming, apoio-bruno-taxonomia, apoio-cora-voz]
        complementa: [pablo-ui, beatriz-docs]
        sinais_ativacao: [naming, "nome de feature", "nome de componente", taxonomia, "design tokens", "voz do produto", "tom de voz", "como chamar", nomenclatura, "glossário de produto"]
        descricao: "Nomenclatura, taxonomia, design tokens, voz do produto"

      apoio-valor:
        agentes: [apoio-hugo-priorizacao, apoio-sofia-lancamento, apoio-rui-audit]
        complementa: [camila-pm, laura-tech-lead]
        sinais_ativacao: [priorização, valor, ROI, "custo-benefício", "tech debt", "dívida técnica", lançamento, "release notes", "ICE score", impacto, "o que fazer primeiro"]
        descricao: "Priorização, releases, audit de custo-benefício e ROI"

      apoio-observabilidade:
        agentes: [apoio-lia-instrumentacao, apoio-otavio-metricas, apoio-vera-growth]
        complementa: [renata-observabilidade, vinicius-performance]
        sinais_ativacao: [tracking, analytics, métricas, eventos, "feature flag", AARRR, funil, conversão, growth, retenção, instrumentação, "o que medir"]
        descricao: "Tracking plans, métricas AARRR, feature flags, experimentação"

      apoio-dx:
        agentes: [apoio-enzo-dx, apoio-clara-comunidade, apoio-tomas-impacto]
        complementa: [beatriz-docs, marcos-devops]
        sinais_ativacao: ["developer experience", DX, contribuidor, "onboarding de dev", "DORA metrics", "lead time", contributor, "documentação de dev", "setup do projeto", "primeiro PR"]
        descricao: "Developer experience, contributor ladder, métricas DORA"

      apoio-revisao-arquitetural:
        agentes: [apoio-alvaro-inversao, apoio-lucia-principios, apoio-felix-provocador]
        complementa: [rafael-staff, diego-sistemas]
        sinais_ativacao: ["revisão arquitetural", "review de arquitetura", "pre-mortem", "red team", steelman, strawman, "advogado do diabo", inversão, "questionar decisão", "validar arquitetura", trade-off]
        descricao: "Inversão de Munger, pre-mortem, red team, debate estruturado"

    colisoes_de_nome:
      regra: "Quando o usuário disser apenas o primeiro nome de um agente que existe nos dois lados, Laura desambigua antes de invocar."
      pares:
        - core: marcos-devops
          apoio: apoio-marcos-specs
          contexto_core: "devops, CI/CD, deploy"
          contexto_apoio: "ADR, spec, decisão narrada"
        - core: helena-security
          apoio: apoio-helena-apresentacao
          contexto_core: "audit, OWASP, segurança"
          contexto_apoio: "demo, storytelling, apresentação"
        - core: elisa-cloud
          apoio: apoio-elisa-naming
          contexto_core: "cloud, FinOps, escolha de provedor"
          contexto_apoio: "naming, nomenclatura"

  squads_verticais:
    descricao: "9 squads verticais com 41 agentes. Tipo: vertical. IMPLEMENTAM (código ou artefato técnico da disciplina), diferente do apoio. Carregados sob demanda por tipo de projeto. Acionados via /kairos-forge:rodar <squad>."
    regra: "Squads verticais complementam (não substituem) a fábrica core. No modo conversacional rodar, máximo 1 squad vertical ativo por vez. No mobilizar, Laura puxa indivíduos de qualquer squad para o Agent Team."

    squads:
      mobile:
        agentes: [mobile-teo-ios, mobile-bianca-android, mobile-igor-crossplatform, mobile-murilo-release, mobile-priscila-qa]
        complementa: [marina-frontend, pablo-ui, ada-acessibilidade, patricia-qa]
        sinais_ativacao: [iOS, Android, mobile, "app nativo", "React Native", Flutter, Swift, SwiftUI, Kotlin, "Jetpack Compose", fastlane, "App Store", "Play Store", TestFlight, XCUITest, Espresso]
        descricao: "Apps iOS e Android (nativo e cross-platform), publicação em loja e QA de device"

      bi:
        agentes: [bi-caio-analytics-engineer, bi-larissa-dashboards, bi-taina-data-analyst, bi-henrique-dataviz]
        complementa: [carlos-dba, fernanda-dados, pablo-ui, beatriz-docs]
        sinais_ativacao: [BI, "business intelligence", dashboard, relatório, dbt, "analytics engineering", "modelagem dimensional", "Power BI", Looker, Metabase, Tableau, coorte, funil, "análise de dados", "data viz", "data storytelling"]
        descricao: "Camada analítica (dbt), dashboards, análise exploratória e visualização de dados"

      dataeng:
        agentes: [dataeng-vitor-lakehouse, dataeng-sabrina-streaming, dataeng-rodrigo-orquestracao, dataeng-aline-qualidade, dataeng-gustavo-governanca]
        complementa: [juliana-etl, fernanda-dados, carlos-dba]
        sinais_ativacao: [Spark, Databricks, Snowflake, lakehouse, "Delta Lake", Iceberg, streaming, Kafka, Flink, CDC, Airflow, Dagster, orquestração, "qualidade de dados", "data quality", "governança de dados", lineage, "big data"]
        descricao: "Plataforma de dados em escala: lakehouse, streaming, orquestração, qualidade e governança"

      ml:
        agentes: [ml-eduardo-engenharia, ml-natalia-data-science, ml-fabio-mlops, ml-yara-visao-nlp, ml-caetano-evals]
        complementa: [gabriel-ia, andre-busca, vinicius-performance, carlos-dba]
        sinais_ativacao: ["machine learning", ML, "feature engineering", "data science", estatística, experimento, "teste A/B", MLOps, drift, "model registry", "visão computacional", "computer vision", NLP, OCR, eval, "avaliação de modelo", benchmark]
        descricao: "ML aplicado/clássico, ciência de dados, MLOps, visão/NLP e avaliação de IA (não-LLM; LLM é do Gabriel)"

      web:
        agentes: [web-sergio-portais, web-melissa-seo, web-joana-cms, web-davi-ecommerce]
        complementa: [marina-frontend, lucas-backend, pablo-ui, vinicius-performance]
        sinais_ativacao: [portal, "site institucional", "landing page", "Next.js", Astro, SSR, SSG, "Core Web Vitals", SEO, "dados estruturados", CMS, "headless CMS", Contentful, Strapi, Sanity, "e-commerce", "loja online", checkout, Shopify]
        descricao: "Portais/sites SSR-SSG, SEO técnico, CMS headless e e-commerce"

      design:
        agentes: [design-manuela-produto, design-heloisa-design-system, design-marcela-pesquisa, design-nina-motion]
        complementa: [isabela-ux, pablo-ui, ada-acessibilidade]
        sinais_ativacao: ["design de produto", wireframe, protótipo, "design system", "design tokens", "biblioteca de componentes", "UX research", "pesquisa de usuário", entrevista, persona, JTBD, "motion design", animação, "micro-interação"]
        descricao: "Product design, design system, pesquisa de UX e motion (disciplina de design, não só UI)"

      sre:
        agentes: [sre-leandro-confiabilidade, sre-wagner-plataforma, sre-tatiana-resiliencia, sre-silvio-incidentes]
        complementa: [marcos-devops, renata-observabilidade, elisa-cloud, vinicius-performance]
        sinais_ativacao: [SRE, SLO, SLI, "error budget", confiabilidade, "on-call", runbook, Kubernetes, k8s, Terraform, IaC, "platform engineering", "chaos engineering", "disaster recovery", DR, failover, incidente, postmortem]
        descricao: "Confiabilidade (SLO), engenharia de plataforma, resiliência/chaos e comando de incidente"

      gestao:
        agentes: [gestao-cristina-eng-manager, gestao-joaquim-agile, gestao-adriana-solutions, gestao-renan-delivery]
        complementa: [laura-tech-lead, camila-pm, rafael-staff]
        sinais_ativacao: ["gestão de engenharia", "eng manager", "saúde do time", capacidade, ágil, scrum, kanban, retrospectiva, "solutions architect", "arquitetura de solução", proposta, RFP, delivery, roadmap, milestone, "status report"]
        descricao: "Gestão de pessoas/entrega, processo ágil e arquitetura de solução voltada ao cliente"

      seguranca:
        agentes: [seguranca-icaro-appsec, seguranca-mauro-ofensiva, seguranca-nara-cloud, seguranca-ravi-devsecops, seguranca-cibele-deteccao, seguranca-bernardo-grc]
        complementa: [helena-security, marcos-devops, renata-observabilidade]
        coordenado_por: helena-security
        sinais_ativacao: [segurança, AppSec, SAST, SCA, OWASP, pentest, ofensiva, DAST, CVE, "gestão de vulnerabilidades", "cloud security", CSPM, IAM, hardening, "segurança Kubernetes", DevSecOps, "supply chain", SBOM, SLSA, detecção, SIEM, "threat hunting", "MITRE ATT&CK", GRC, "NIST CSF", "CIS Controls", "controles mínimos", "postura de segurança", "resposta a incidente"]
        descricao: "Profundidade de segurança (genérica/MIT): AppSec, ofensiva, cloud-sec, DevSecOps, detecção/resposta e GRC/controles. Coordenado pela Helena (core). Regulado BR (LGPD/ANPD/Lei de Cibersegurança/GSI) = kairos-ai."

    fronteiras_vs_core:
      regra: "Squads verticais complementam o core, não duplicam. Quando o sinal for ambíguo, prefira o core para o caso simples e o vertical para profundidade/escala."
      pares:
        - core: gabriel-ia
          vertical: "squad ml"
          contexto_core: "IA generativa, LLM, RAG, tool use, orquestração de agentes"
          contexto_vertical: "ML aplicado/clássico, MLOps, visão/NLP, evals"
        - core: juliana-etl
          vertical: "squad dataeng"
          contexto_core: "pipelines e jobs batch do dia a dia"
          contexto_vertical: "compute distribuído, streaming, governança em escala"
        - core: marina-frontend
          vertical: "squad web"
          contexto_core: "apps, SPAs, dashboards interativos"
          contexto_vertical: "portais/marketing/e-commerce SSR-SSG SEO-crítico"
        - core: marcos-devops
          vertical: "squad sre"
          contexto_core: "CI/CD, Dockerfile, deploy, rollback"
          contexto_vertical: "SLO, plataforma K8s, chaos/DR, comando de incidente"
        - core: helena-security
          vertical: "squad seguranca"
          contexto_core: "generalista de segurança, auditora pré-PR, coordena o squad"
          contexto_vertical: "profundidade: AppSec, ofensiva, cloud-sec, DevSecOps, detecção/resposta, GRC"
