# kairos-forge — revisão multi-agente automática no PR
#
# Helena (segurança), Patrícia (QA), Vinícius (performance) e os demais conforme
# o escopo do diff leem o PR e comentam o parecer consolidado. Não bloqueia o
# merge: informa. Quem bloqueia é o CI de testes do projeto.
#
# Instale em .github/workflows/ e crie o secret ANTHROPIC_API_KEY.

name: kairos-forge — revisar PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: forge-revisar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisar:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar credencial
        id: cred
        env:
          CHAVE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "⏭️  ANTHROPIC_API_KEY não configurado — revisão pulada."
            echo "ativo=false" >> "$GITHUB_OUTPUT"
          else
            echo "ativo=true" >> "$GITHUB_OUTPUT"
          fi

      # A fábrica é clonada FORA do gate de credencial de propósito: os dois passos
      # de guardrail abaixo são Python puro, não consomem token e não precisam de
      # chave. Num repo sem o segredo configurado, eles continuam sendo o único
      # sinal automático sobre o harness — e um PR que afrouxa o guardrail é
      # exatamente o PR em que você não quer o sinal desligado.
      - name: Instalar a fábrica (sem custo)
        run: git clone --depth 1 https://github.com/VilelaAI/kairos-forge /tmp/forge

      - name: Guardrail bem formado (o CI não tem PreToolUse — o contrato roda depois)
        run: python3 /tmp/forge/scripts/guardrail.py verificar . || true

      - name: Guardrail morde? (autoteste)
        # `verificar` diz se a configuração está bem formada; o autoteste prova que
        # a regra BLOQUEIA, com controles benignos que devem passar. Não escreve nada
        # no projeto (roda numa sandbox). Se o PR mexeu em `.agents/guardrails.json`,
        # é aqui que aparece.
        id: autoteste
        run: |
          python3 /tmp/forge/scripts/guardrail.py autoteste . > autoteste.txt 2>&1 \
            && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
          cat autoteste.txt

      - uses: actions/setup-node@v4
        if: steps.cred.outputs.ativo == 'true'
        with:
          node-version: "20"

      - name: Instalar Claude Code
        if: steps.cred.outputs.ativo == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          mkdir -p .claude
          cp -R /tmp/forge/plugin/skills .claude/skills
          cp -R /tmp/forge/plugin/agents .claude/agents

      - name: Rodar a revisão da fábrica
        if: steps.cred.outputs.ativo == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          claude -p "Use a skill kairos-forge:revisar. Revise o diff entre \
            $BASE e $HEAD. Produza APENAS o relatório consolidado em markdown, \
            em PT-BR, com o veredicto agregado e os achados por severidade. \
            Não altere nenhum arquivo." > revisao.md || true
          test -s revisao.md || echo "A revisão não produziu saída." > revisao.md

      - name: Comentar no PR
        if: steps.cred.outputs.ativo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## 🔥 Revisão da fábrica kairos-forge"
            echo
            cat revisao.md
            echo
            if [ "${{ steps.autoteste.outputs.ok }}" != "true" ]; then
              echo "> ⚠️ **O autoteste do guardrail falhou nesta branch.** Alguma regra"
              echo "> parou de bloquear, ou passou a bloquear coisa benigna. Leia o"
              echo "> parecer acima sabendo que o harness não estava inteiro."
              echo
            fi
            echo "<details><summary>Autoteste do guardrail</summary>"
            echo
            echo '```'
            cat autoteste.txt
            echo '```'
            echo
            echo "</details>"
            echo
            echo "---"
            echo "_Parecer automático — não substitui julgamento humano em decisão de design._"
          } > comentario.md
          gh pr comment "$PR" --body-file comentario.md
